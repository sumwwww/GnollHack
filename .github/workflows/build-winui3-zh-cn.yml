name: Build GnollHack WinUI3 Simplified Chinese (Windows x64)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build Configuration (Release or Debug)"
        type: choice
        options: [Release, Debug]
        required: true
        default: "Release"
  push:
    branches: [ master, main, zh-CN, "codex/zh-cn-build-and-localization" ]

permissions:
  contents: read

concurrency:
  group: winui3-zh-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-winui3-zh-cn:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      CI: true
      BUILD_CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout GnollHack Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"
          dotnet-quality: "ga"

      - name: Verify localization preserves compiler inputs
        shell: pwsh
        run: |
          python tools_zh_CN/test_localization.py
          if ($LASTEXITCODE -ne 0) { throw "Localization regression check failed" }

      - name: Fix Windows console encoding for UTF-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          Write-Host "Console output encoding: $([Console]::OutputEncoding.EncodingName)"
          Write-Host "PYTHONUTF8=$env:PYTHONUTF8"
          Write-Host "PYTHONIOENCODING=$env:PYTHONIOENCODING"

      - name: Clean old build artifacts before build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clean -xfd
          Write-Host "Repository cleaned with git clean -xfd"

      - name: Detect installed Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "10.0.26100.0",
            "10.0.22621.0",
            "10.0.22000.0",
            "10.0.19041.0"
          )

          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $selected = $null

          foreach ($v in $candidates) {
            $candidate = Join-Path $root $v
            if (Test-Path $candidate) {
              $selected = $v
              break
            }
          }

          if (-not $selected) {
            $children = @()
            if (Test-Path $root) {
              $children = Get-ChildItem $root | Select-Object -ExpandProperty Name
            }
            Write-Host "Windows Kits include folder: $root"
            if ($children.Count -gt 0) {
              Write-Host "Installed SDK folders:"
              $children | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "No Windows SDK folders found under $root"
            }
            throw "No compatible Windows SDK found under $root"
          }

          "WIN_SDK_VERSION=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected Windows SDK version: $selected"

      - name: Validate expected build inputs for levcomp / .des data generation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "dat/arch.des",
            "dat/barb.des",
            "dat/bigroom.des",
            "dat/bovine.des",
            "dat/quantum.des",
            "dat/castle.des",
            "dat/caveman.des",
            "dat/endgame.des",
            "dat/gehennom.des",
            "dat/mines.des"
          )

          foreach ($f in $requiredFiles) {
            if (-not (Test-Path $f)) {
              throw "Required build input file not found: $f"
            }
            Write-Host "OK: $f"
          }

          $generatedDir = "tools/Release/x64"
          New-Item -ItemType Directory -Force -Path $generatedDir | Out-Null

          Write-Host "levcomp input validation passed."

      - name: Restore .NET assets for SourceFileTimeStamper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "win/win32/xpl/SourceFileTimeStamper/SourceFileTimeStamper.csproj" --nologo

      - name: Install .NET MAUI Workload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw "MAUI workload installation failed" }

      - name: Download Official Tile Sets & FMOD Sound Banks from GitHub Releases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "win/win32/tileset" | Out-Null
          New-Item -ItemType Directory -Force -Path "win/win32/bank/Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "win/win32/bank/Mobile" | Out-Null

          Write-Host "Fetching latest GnollHackTileSet release assets..."
          try {
            $tileRel = Invoke-RestMethod -Uri "https://api.github.com/repos/hyvanmielenpelit/GnollHackTileSet/releases/latest"
            foreach ($asset in $tileRel.assets) {
              if ($asset.name -match "\.png$|\.zip$") {
                $dest = Join-Path "win/win32/tileset" $asset.name
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $dest
                if ($asset.name -match "\.zip$") {
                  Expand-Archive -Path $dest -DestinationPath "win/win32/tileset" -Force
                }
              }
            }
          } catch {
            throw "Could not auto-fetch GnollHackTileSet release: $_"
          }

          Write-Host "Fetching latest GnollHackSoundSet release assets..."
          try {
            $soundRel = Invoke-RestMethod -Uri "https://api.github.com/repos/hyvanmielenpelit/GnollHackSoundSet/releases/latest"
            foreach ($asset in $soundRel.assets) {
              $dest = Join-Path "win/win32/bank" $asset.name
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $dest
              if ($asset.name -match "\.zip$") {
                Expand-Archive -Path $dest -DestinationPath "win/win32/bank" -Force
              } elseif ($asset.name -match "\.bank$") {
                Copy-Item $dest "win/win32/bank/Desktop/" -Force
                Copy-Item $dest "win/win32/bank/Mobile/" -Force
              }
            }
          } catch {
            throw "Could not auto-fetch GnollHackSoundSet release: $_"
          }

      - name: Validate required downloaded resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "win/win32/tileset/gnollhack_64x96_transparent_32bits.png",
            "win/win32/tileset/gnollhack_64x96_transparent_32bits-2.png",
            "win/win32/tileset/gnollhack_64x96_transparent_32bits-3.png"
          )
          foreach ($bank in @("Auxiliary", "Intro", "Master", "Master.strings", "Music", "Preliminary")) {
            $required += "win/win32/bank/Desktop/$bank.bank"
          }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing required asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -eq 0) { throw "Empty required asset: $file" }
          }
          $required | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/asset-hashes.json"

      - name: Apply Simplified Chinese (zh-CN) Localization Patch if present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          $script = Join-Path $PWD "tools_zh_CN/apply_zh_cn_patch.py"
          if (Test-Path $script) {
            Write-Host "Applying zh-CN patch: $script"
            python $script --repo $PWD
            if ($LASTEXITCODE -ne 0) { throw "Localization generation failed" }
          } else {
            throw "Localization patch script not found"
          }

      - name: Stage 1 - Build Native C99 Engine & nhdat Archive (GnollHack.sln x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild not found. Visual Studio Build Tools may not be installed on the runner."
          }

          $cfg = "${{ env.BUILD_CONFIGURATION }}"
          if ([string]::IsNullOrEmpty($cfg)) { $cfg = "Release" }

          Write-Host "Using MSBuild: $msbuild"
          Write-Host "Using Windows SDK: $env:WIN_SDK_VERSION"

          & $msbuild "win/win32/vs/GnollHack.sln" `
            /t:Rebuild `
            /p:Configuration=$cfg `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$env:WIN_SDK_VERSION `
            /bl:"$env:RUNNER_TEMP/native-build.binlog" `
            /m:1
          if ($LASTEXITCODE -ne 0) { throw "Native engine build failed" }

      - name: Restore Windows client and build Sentry native component
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "win/win32/xpl/GnollHackM/GnollHackM.csproj" -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Windows restore failed" }
          & "./win/win32/xpl/gnhsentrywin/Build-GnhSentry.ps1"

      - name: Stage 2 - Build Modern Windows WinUI 3 Client (GnollHackM.csproj)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          $cfg = "${{ env.BUILD_CONFIGURATION }}"
          if ([string]::IsNullOrEmpty($cfg)) { $cfg = "Release" }

          Write-Host "Building WinUI app in CI mode with package signing disabled..."
          dotnet publish "win/win32/xpl/GnollHackM/GnollHackM.csproj" `
            -c $cfg `
            -f net10.0-windows10.0.19041.0 `
            -p:TargetFrameworks=net10.0-windows10.0.19041.0 `
            -r win-x64 `
            -p:Platform=x64 `
            -bl:"$env:RUNNER_TEMP/client-publish.binlog" `
            -p:WindowsPackageType=None `
            -p:SelfContained=true `
            -p:AppxPackageSigningEnabled=false `
            -p:PackageCertificateThumbprint="" `
            -p:GenerateAppInstallerFile=false `
            -o "$env:RUNNER_TEMP/GnollHack_WinUI3_zhCN_Build"
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed" }

      - name: Upload Compiled GnollHack WinUI3 Simplified Chinese Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: GnollHack-WinUI3-zh-CN-Windows-x64
          path: ${{ runner.temp }}/GnollHack_WinUI3_zhCN_Build

      - name: Upload diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui3-zh-cn-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/*.binlog
            ${{ runner.temp }}/asset-hashes.json
